# Shared proxy settings for every LexLoom API location.
#
# Install as /etc/nginx/snippets/lexloom-proxy.conf.
#
# This file exists so the streaming settings cannot be applied to one location
# and forgotten on another. Every one of them is load-bearing; none is a default
# worth restating for its own sake.

proxy_pass http://127.0.0.1:8100;

# HTTP/1.1 with an empty Connection header. nginx proxies with HTTP/1.0 by
# default, which has no chunked transfer encoding — so a streaming response
# either buffers to completion or breaks. Clearing Connection (rather than
# passing the client's) is what lets nginx keep the upstream socket alive.
proxy_http_version 1.1;
proxy_set_header Connection "";

# THE setting this project exists to get right. nginx buffers a proxied
# response by default and releases it when the upstream finishes, which turns
# an incremental answer into one flush at the end — exactly the bug the SSE
# endpoint was built to fix, reintroduced by the reverse proxy. The application
# also sends X-Accel-Buffering: no, but that header is a request to nginx, not
# a guarantee, and it is honoured only where nginx is willing. Set both.
proxy_buffering off;
proxy_cache off;

# Compression buffers too, and would defeat the above. Starlette already
# excludes text/event-stream from its own compressor; nginx has no such
# instinct, so say it here.
gzip off;

# A stream lives as long as the answer takes. The demo's answers run about a
# second, but a real provider is slower and a client on a bad connection slower
# still; the cost of a generous read timeout is a socket, and the cost of a
# tight one is a truncated answer that looks like a bug in the application.
proxy_read_timeout 300s;
proxy_send_timeout 300s;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;

# Deliberately $remote_addr and NOT $proxy_add_x_forwarded_for.
#
# The usual form appends the peer address to whatever the client already sent,
# so a caller who sets their own X-Forwarded-For controls everything except the
# last entry. Any code that reads the FIRST entry — which is the conventional
# reading, and what most libraries do — then trusts a value the attacker chose.
# The demo-login rate limit is keyed on that address, and a limit anyone can
# spoof past is worse than no limit, because it looks like protection.
#
# Overwriting it means this header carries exactly one value, the address nginx
# actually accepted the connection from. There is one proxy in front of this
# application and it is this file; if that ever stops being true, this line has
# to be reconsidered along with whatever reads it.
proxy_set_header X-Forwarded-For $remote_addr;
