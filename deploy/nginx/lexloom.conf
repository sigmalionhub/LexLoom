# LexLoom — nginx vhost.
#
# One origin serves both halves: the statically exported frontend from disk and
# the API by proxy. That is not a deployment convenience, it is a requirement —
# the backend ships no CORS headers at all, deliberately, so a frontend on a
# second origin could not call it. Keeping them together also means the SSE
# stream and the page that consumes it share a connection pool and a TLS
# session.
#
# Install:  /etc/nginx/sites-available/lexloom  (symlink into sites-enabled)
# TLS:      added by `certbot --nginx -d lexloom.sigmalion.io`, which rewrites
#           this file in place and adds the :443 server block. Keep this file
#           plain HTTP; certbot needs the :80 block to answer the challenge.

server {
    listen 80;
    listen [::]:80;
    server_name lexloom.sigmalion.io;

    root /var/www/portfolio/lexloom/web;
    index index.html;

    # No uploads in M1. A small ceiling costs nothing and removes a class of
    # abuse from a box that is shared with other applications.
    client_max_body_size 256k;

    # Cheap and unbreakable. A Content-Security-Policy belongs here too, but
    # Next injects inline hydration script and inline styles, so a policy
    # written without testing it against the built export would silently blank
    # the page. Add it deliberately, with the page open, rather than on faith.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ---- the API -----------------------------------------------------------
    #
    # `location ^~` so these win over any file that happens to exist under the
    # same path in the export.

    location ^~ /api/ {
        include /etc/nginx/snippets/lexloom-proxy.conf;
    }

    location ^~ /health/ {
        include /etc/nginx/snippets/lexloom-proxy.conf;
        access_log off;   # the readiness probe would otherwise dominate the log
    }

    location = /.well-known/jwks.json {
        include /etc/nginx/snippets/lexloom-proxy.conf;
    }

    # The interactive contract is part of what this demo is for: a reader
    # should be able to try the API without cloning anything.
    location = /openapi.json { include /etc/nginx/snippets/lexloom-proxy.conf; }
    location = /docs         { include /etc/nginx/snippets/lexloom-proxy.conf; }
    location ^~ /docs/       { include /etc/nginx/snippets/lexloom-proxy.conf; }

    # ---- the static export -------------------------------------------------

    # Next content-hashes everything under /_next/static, so these filenames
    # change whenever their bytes do and can be cached indefinitely.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # HTML must not be cached, or a redeploy leaves visitors on the old bundle
    # while its hashed assets are already gone — a blank page that looks like an
    # outage and clears itself only on a hard refresh.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
