name: CI

on:
  # Both names on purpose. The default branch here is `master`; listing only
  # `main` means the workflow never fires on a push and the badge in the README
  # is decorative — worse than having no CI, because it looks like coverage.
  push: {branches: [main, master]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # GitHub's default is six hours. The suite runs in under a minute, so this
    # is only ever reached by something stuck — a database lock that never
    # clears, a service container that never becomes healthy — and six hours of
    # a stuck runner buys no more information than fifteen minutes of it.
    # pytest-timeout bounds each test; this bounds everything outside pytest.
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lexloom_migrator
          POSTGRES_PASSWORD: migrator
          POSTGRES_DB: lexloom
        options: >-
          --health-cmd "pg_isready -U lexloom_migrator" --health-interval 5s
          --health-timeout 3s --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      # Pin an interpreter from the runner's tool cache. `uv pip install --system`
      # otherwise resolves Debian's /usr Python, which is externally managed
      # (PEP 668) and refuses the install. Invisible locally, where --system is
      # never used.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv pip install --system -e "backend[dev]"
      - name: Create application roles
        # Must grant exactly what deploy/postgres/init/01-roles.sh grants for the
        # local Compose stack, or a permission drift here surfaces as a false RLS
        # failure that is expensive to tell apart from the real thing.
        run: |
          PGPASSWORD=migrator psql -h localhost -U lexloom_migrator -d lexloom -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE lexloom_app LOGIN PASSWORD 'app';
          CREATE ROLE lexloom_worker LOGIN PASSWORD 'worker';
          GRANT CONNECT ON DATABASE lexloom TO lexloom_app, lexloom_worker;
          GRANT USAGE ON SCHEMA public TO lexloom_app, lexloom_worker;
          SQL
      - run: ruff check backend/
      - name: Run migrations
        working-directory: backend
        env:
          # The migrator role, not the app role: migrations create tables and
          # the app role deliberately cannot (see the startup guard in
          # app/db/engine.py). alembic/env.py reads DATABASE_URL when no -x dsn
          # is given; alembic.ini only holds a placeholder DSN.
          DATABASE_URL: postgresql+asyncpg://lexloom_migrator:migrator@localhost:5432/lexloom
        # `python -m alembic`, not bare `alembic`: -m prepends the working
        # directory to sys.path. CI installs the project, so bare alembic would
        # work here too — but the deployed image installs dependencies only and
        # runs from the source tree, where it would not. Keeping -m means this
        # command is identical everywhere it runs.
        run: python -m alembic upgrade head
      - name: Tests
        working-directory: backend
        env:
          # The app role, not the migrator role: the startup guard in
          # app/db/engine.py refuses to run as a role that is a superuser, has
          # BYPASSRLS, or owns tables in schema public. The migrator role owns
          # every table it just created, so reusing its DSN here would trip the
          # guard on every DB-touching test.
          DATABASE_URL: postgresql+asyncpg://lexloom_app:app@localhost:5432/lexloom
          REDIS_URL: redis://localhost:6379/0
          ENV: ci
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The exact version the deploy host runs, not "24" and not the floor
          # in `engines`. The frontend is built ON that host during a release,
          # so a build that passes here and fails there is a broken deploy that
          # CI called green.
          #
          # Exact, because the minor matters. "24" resolves to whatever the
          # runner's tool cache holds, which was behind the host — so CI ran
          # `npm ci` on npm 11.8 and passed, while the host's npm 11.9 rejected
          # the same lockfile as inconsistent and the deploy stopped dead. The
          # lockfile has to be generated by, and validated against, the npm that
          # actually builds the release.
          #
          # When the host's Node moves, move this with it.
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `next build` type-checks too, but only the files it reaches from a route.
      # Anything under lib/ that no page imports yet would go unchecked.
      - run: npx tsc --noEmit
      - run: npm run build
      - name: The export must actually contain the page
        # `next build` succeeds and emits nothing if `output: 'export'` is ever
        # dropped from next.config.mjs — the deploy would then copy an empty
        # directory into the web root and nginx would serve 404s for a site the
        # build called successful.
        run: test -f out/index.html

  compose-smoke:
    runs-on: ubuntu-latest
    # The polling loop below gives up after 60s, but `docker compose up --build`
    # ahead of it is unbounded.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Stack must come up on a clean machine
        # No .env is created here on purpose: a clean runner has none, and the
        # Compose file's ${VAR:-default} substitutions must be what makes the
        # stack usable without one. Targets /health/live, not /health/ready,
        # because liveness touches no dependencies — it only proves the process
        # started, which is what this smoke test exists to catch regressions in.
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8100/health/live && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8100/health/live || { docker compose logs; exit 1; }
      - name: ...and every service must still be running, not just the API
        # The API answering proves the API started. Each service constructs its
        # own settings, so one can exit at import while the other three stay up
        # and every HTTP check passes — which is exactly how a demo shipped with
        # no Celery worker. Compare the set, do not eyeball it.
        run: |
          docker compose ps
          running=$(docker compose ps --status running --format '{{.Service}}' | sort | tr '\n' ' ')
          expected='api postgres redis worker '
          test "$running" = "$expected" || {
            echo "running: [$running]"; echo "expected: [$expected]"
            docker compose logs
            exit 1
          }
