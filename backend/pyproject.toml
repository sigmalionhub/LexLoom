[project]
name = "lexloom"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "structlog>=24.4",
    "sse-starlette>=2.1",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "pgvector>=0.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Declare the package explicitly. Once `alembic/` exists next to `app/`,
# setuptools' flat-layout auto-discovery sees two candidate top-level packages
# and refuses to build — so `pip install -e .` fails on a clean clone while
# continuing to work in any venv created before the migrations existed. That is
# the worst shape of bug for a portfolio repository: it breaks for every reader
# and for nobody who built it.
[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
