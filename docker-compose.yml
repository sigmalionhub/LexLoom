services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lexloom_migrator
      POSTGRES_PASSWORD: ${MIGRATOR_DB_PASSWORD:-migrator}
      POSTGRES_DB: lexloom
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-worker}
    command: >
      postgres -c shared_buffers=128MB -c work_mem=8MB -c maintenance_work_mem=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Published on 5433, not 5432: the development host runs a native
      # PostgreSQL service that already owns 127.0.0.1:5432, and Docker then
      # fails to bind silently — host-side psql reaches the wrong server.
      # The container's internal port stays 5432, so nothing else changes.
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexloom_migrator -d lexloom"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 48mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://lexloom_app:${APP_DB_PASSWORD:-app}@postgres:5432/lexloom
      REDIS_URL: redis://redis:6379/0
      ENV: ${ENV:-local}
      # The prefix every RFC 9457 `type` URI is built from. It has to be passed
      # explicitly, and so does every variable below it: `.env` sits at the
      # repository root while the build context is `./backend`, so it is not in
      # the image at all and the container's own `Settings(env_file=".env")`
      # finds nothing. A value set in `.env` reaches Compose and stops there.
      # Without this line the setting falls back to its default and a reader
      # who edits .env, as docs/errors.md invites them to, sees `type` keep
      # saying localhost with no way to tell whether the variable or the
      # documentation is wrong.
      ERROR_TYPE_BASE_URL: ${ERROR_TYPE_BASE_URL:-http://localhost:8100}
      # Where the API fetches the key set it verifies tokens against. Passed
      # explicitly because ENV=demo requires it to be HTTPS: a plaintext JWKS
      # fetch is an on-path opening, and a spoofed key set makes every
      # subsequent token verify. On the demo box this is the public origin,
      # which nginx proxies straight back to this container.
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://localhost:8100/.well-known/jwks.json}
      # Whose X-Forwarded-For the demo-login rate limit believes. The code's
      # default is loopback only, which is the safe default for a process
      # reached directly — and the wrong one here: the port is published on
      # 127.0.0.1 of the *host*, so nginx's connection is forwarded in and the
      # container sees the Compose bridge gateway (172.x) as its peer, never
      # loopback. Left at the default, every visitor would share one bucket.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
      # ...and the bridge range is not, on its own, a trustworthy statement.
      # EVERY connection through the published port arrives from the gateway,
      # so on a shared host a server-side request forgery in a neighbouring
      # application looks exactly like nginx and could name its own limit key.
      # This secret is what nginx has and the neighbour does not; ENV=demo
      # refuses to start without it. Empty is fine for local development, where
      # nothing else is on the network.
      TRUSTED_PROXY_SECRET: ${TRUSTED_PROXY_SECRET:-}
      # Forwarded so the documented knob is a real one. It is safe to expose
      # precisely because the guard behind it now works: Settings refuses to
      # construct with this false when ENV is demo or production, so the worst
      # a `false` here can do is stop a public box from starting.
      LIMITS_ENABLED: ${LIMITS_ENABLED:-true}
      # The numbers behind those ceilings. Forwarded for the same reason as
      # everything above: `.env.example` presents all five as knobs, and a knob
      # Compose does not forward is a knob that turns nothing while looking
      # like it works. The lesson had been learned for ERROR_TYPE_BASE_URL and
      # not swept for the rest, so an operator lowering MAX_CONCURRENT_STREAMS
      # on a box that was running out of memory would have changed nothing and
      # had no way to tell.
      #
      # The defaults repeat the ones in app/config.py, which is a duplication
      # with teeth: tests/test_compose_environment.py fails if `.env.example`
      # names a setting this block does not.
      DEMO_LOGIN_LIMIT: ${DEMO_LOGIN_LIMIT:-30}
      DEMO_LOGIN_WINDOW_SECONDS: ${DEMO_LOGIN_WINDOW_SECONDS:-3600}
      MAX_CONCURRENT_STREAMS: ${MAX_CONCURRENT_STREAMS:-16}
      MAX_CONCURRENT_STREAMS_PER_ORG: ${MAX_CONCURRENT_STREAMS_PER_ORG:-4}
      STREAM_SLOT_TTL_SECONDS: ${STREAM_SLOT_TTL_SECONDS:-600}
    ports:
      - "127.0.0.1:8100:8100"
    restart: unless-stopped
    mem_limit: 450m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: ./backend
    command: >
      celery -A app.worker.celery_app worker
      --loglevel=info --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=50
    environment:
      DATABASE_URL: postgresql+asyncpg://lexloom_worker:${WORKER_DB_PASSWORD:-worker}@postgres:5432/lexloom
      REDIS_URL: redis://redis:6379/0
      ENV: ${ENV:-local}
      # A literal `none`, deliberately not ${TRUSTED_PROXIES:-...}. This process
      # serves no HTTP and never reads a forwarding header, so there is no proxy
      # for it to trust — and saying so is also what keeps it startable. The
      # code's default trusts loopback, `Settings` demands TRUSTED_PROXY_SECRET
      # of any PUBLIC_ENVS deployment that trusts a proxy at all, and this
      # service is not given that secret because it has no use for one. With
      # ENV=demo and the default inherited, `get_settings()` at the top of
      # app/worker/celery_app.py raised and the container exited at import,
      # while the API next to it stayed up — a stack that looks deployed and has
      # no background worker. Inheriting the operator's value would restore
      # exactly that, so this line does not interpolate.
      TRUSTED_PROXIES: none
    # `unless-stopped` on every service, not just this one. The box is
    # unattended between demonstrations, so a reboot, a Docker daemon restart or
    # an OOM kill of any single container would otherwise leave the stack
    # silently short a piece. The cost is that a configuration error becomes a
    # restart loop rather than one clean exit — which is the louder signal, not
    # the quieter one: `docker compose ps` reports `Restarting` where it used to
    # report `Exited`, Docker backs the attempts off exponentially, and the
    # runbook's verification step now reads that column. `unless-stopped` rather
    # than `always` so a deliberate `docker compose stop` survives a daemon
    # restart.
    restart: unless-stopped
    mem_limit: 650m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build: ./backend
    # --schedule points celery's last-run bookkeeping at /tmp rather than its
    # default of the working directory. The image's WORKDIR (/app) is created
    # by Dockerfile's WORKDIR instruction, which runs as root before the
    # `--chown=lexloom:lexloom` COPY, so the directory itself stays
    # root-owned even though the files copied into it are not — `beat`, which
    # runs as `lexloom` and is the only service that writes into its working
    # directory at runtime, fails at startup with a plain "Permission denied"
    # otherwise. /tmp is not a volume, so this file does not survive a
    # restart; that only costs beat re-scheduling from "now" instead of from
    # its last tick, which is one wakeup, not a correctness problem.
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      DATABASE_URL: postgresql+asyncpg://lexloom_worker:${WORKER_DB_PASSWORD:-worker}@postgres:5432/lexloom
      REDIS_URL: redis://redis:6379/0
      ENV: ${ENV:-local}
      TRUSTED_PROXIES: none   # same reason as the worker: serves no HTTP
      # How often the purge schedule fires, in seconds. Read directly from the
      # environment by app/worker/celery_app.py, not through Settings — see the
      # comment there. Left unset in production, so the default (3600, one
      # hour) is what actually runs; a test can override it to prove the purge
      # fires without waiting an hour for it.
      PURGE_EXPIRED_ORGS_SCHEDULE_SECONDS: ${PURGE_EXPIRED_ORGS_SCHEDULE_SECONDS:-3600}
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 96m   # equal to mem_limit means: no swap for this container
    depends_on:
      redis: {condition: service_healthy}

volumes:
  pgdata:
