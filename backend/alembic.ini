[alembic]
script_location = alembic

# Placeholder only. The real DSN is resolved at runtime by alembic/env.py in
# this order: the `-x dsn=...` command-line argument, then the DATABASE_URL
# environment variable, then this value. Never put a real password here.
sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/lexloom

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
