[project]
name = "lexloom"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "structlog>=24.4",
    "sse-starlette>=2.1",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "pgvector>=0.3.6",
    # The ONNX embedding runtime. Upper-bounded, unlike everything above it,
    # and the bound is the point: this is the only dependency whose minor
    # version can change how much memory this process holds. The container
    # limits are sized against whole-process figures measured inside the image
    # under the real limits: 264 MiB for the API shape, 301 MiB for the worker
    # at a batch of 32 (fastembed 0.5.1, all-MiniLM-L6-v2), on a 2 GB box shared
    # with someone else's production. Those are not the model-only host figures
    # quoted in docker-compose.yml — the limits bound the whole process, not the
    # model. A floating minor that bumps ONNX Runtime would move these numbers
    # without moving any line in this repository, and the first symptom would be
    # an OOM kill of a neighbour.
    "fastembed>=0.5.1,<0.6",
    # Exact pin, against this file's own >= convention, and for one reason:
    # the extraction output changes between releases (whitespace, ligatures,
    # column order, reading-order heuristics). Every other dependency here is
    # pinned loosely because its output is an API contract; this one's output
    # *is* the data, and a change to it shifts every chunk boundary and every
    # ordinal the M2.4 gold set keys on. A loose pin would make the eval
    # numbers a function of when the venv was built.
    #
    # Not `pypdf`, which this dependency replaced (fix round 1, task-22-report.md):
    # `pypdf` breaks nearly every word of `gdpr-full.pdf`'s justified-text
    # typesetting into fragments ("Ha ving regar d to the opinion"), measured
    # at 0 intact "Article"s and an 8-9% single-letter-token rate over the
    # first 20 pages, against pdfminer.six's 7 and 2.1% — matching `pdftotext`
    # (poppler) measured the same way. Chosen over `pdftotext` itself and over
    # `pypdfium2` (see task-22-report.md, "Fix round 1", for both candidates'
    # numbers): this one needs no system package in the image, no subprocess
    # call from the worker, and ties poppler's own measured quality on this
    # document.
    "pdfminer.six==20260107",
    # Pinned exactly, for the same reason as `pdfminer.six` above and not a
    # weaker one: `(source_key, chunk_ordinal)` is a chunk's identity, and it is
    # a function of what the extractor returns. A floating extractor makes chunk
    # identity a function of when the venv was built.
    #
    # `python-docx` reads paragraph styles, which is the whole reason a `.docx`
    # earns its place beside a PDF here: the heading structure is *given* by the
    # format instead of inferred from typography by the GDPR-specific boundary
    # regexes in `parse.py`. What it does not give is document order across
    # tables — `document.paragraphs` skips every paragraph inside a table — so
    # `extract_docx.py` walks the body element itself. See its docstring.
    "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # The suite makes a database transaction block on purpose (the purge-race
    # test). Everything inside it is bounded, but a lock is exactly the failure
    # that outlives its own guards, and an unbounded pytest on GitHub Actions
    # runs to the six-hour job default before anyone learns anything.
    "pytest-timeout>=2.3",
    # docker-compose.yml is read by tests/test_compose_environment.py, which
    # checks that every containerised process can construct its settings on the
    # public box. Declared rather than leant on as a transitive dependency of
    # something else: the one thing that test must not do is fail to import and
    # be counted as absent.
    "pyyaml>=6.0",
    # Upper-bounded, and the bound is the point. A linter's rule set is not a
    # stable interface: 0.16 both lengthened an existing E501 finding and began
    # sorting a `# noqa`-carrying import block that 0.8 left alone, so `ruff
    # check` went red on a tree nobody had touched. A floating linter turns CI
    # into a clock — it fails on the day upstream ships a rule, in files whose
    # author is long gone, and the first person to see it is whoever happened
    # to push next. Raise this deliberately, with the new findings read.
    "ruff>=0.8,<0.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Declare the package explicitly. Once `alembic/` exists next to `app/`,
# setuptools' flat-layout auto-discovery sees two candidate top-level packages
# and refuses to build — so `pip install -e .` fails on a clean clone while
# continuing to work in any venv created before the migrations existed. That is
# the worst shape of bug for a portfolio repository: it breaks for every reader
# and for nobody who built it.
#
# find/include (not a literal `packages = ["app"]` list): a literal list is
# not recursive, so it would ship only app/__init__.py and silently drop every
# subpackage (app.api, app.api.v1, app.db, app.worker) from a non-editable
# build. Nothing exercises that path today (CI and local dev both install
# editable), which is exactly why it would have broken confusingly later.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Per test, not per run. The slowest test here waits for a Postgres backend to
# reach a row lock and gives that 30s of its own; 120 leaves room for a loaded
# CI runner while still turning a genuine hang into a reported failure with a
# traceback pointing at the line that hung.
timeout = 120
# Registered rather than left implicit, so `--strict-markers` stays available
# and a typo in the decorator is an error instead of a test that never runs.
# conftest.py skips these when the weights are absent; see the hook there for
# why an absent model is a skip and not a failure.
markers = [
    "model: needs the real ONNX embedding weights on disk (~90 MB)",
]
