name: CI

on:
  # Both names on purpose. The default branch here is `master`; listing only
  # `main` means the workflow never fires on a push and the badge in the README
  # is decorative — worse than having no CI, because it looks like coverage.
  push: {branches: [main, master]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # GitHub's default is six hours. The suite runs in under a minute, so this
    # is only ever reached by something stuck — a database lock that never
    # clears, a service container that never becomes healthy — and six hours of
    # a stuck runner buys no more information than fifteen minutes of it.
    # pytest-timeout bounds each test; this bounds everything outside pytest.
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lexloom_migrator
          POSTGRES_PASSWORD: migrator
          POSTGRES_DB: lexloom
        options: >-
          --health-cmd "pg_isready -U lexloom_migrator" --health-interval 5s
          --health-timeout 3s --health-retries 10
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      # Pin an interpreter from the runner's tool cache. `uv pip install --system`
      # otherwise resolves Debian's /usr Python, which is externally managed
      # (PEP 668) and refuses the install. Invisible locally, where --system is
      # never used.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      # The ONNX embedding weights, 91 334 718 bytes, fetched over the network on
      # a miss. This job installs onto a bare runner — there is no image, so
      # nothing has baked them in the way backend/Dockerfile does for the
      # deployment, and without this every run downloads them again.
      #
      # fastembed tries HuggingFace first and a Google Cloud Storage tarball
      # second, so a HuggingFace outage alone is survivable — verified, it falls
      # back and succeeds. It is the loss of both, or of egress generally, that
      # turns CI red for a reason unconnected to the code.
      #
      # `~/.cache/fastembed` is the path app/chat/embedding.py falls back to when
      # FASTEMBED_CACHE_PATH is unset, which is the case here. The two must not
      # drift, or this restores into a directory nothing reads.
      #
      # This key is written once, here, and copied verbatim by the `evals` job
      # in Task 27. Two spellings of one key are two keys: the entry silently
      # stops being shared, each job downloads its own copy, and nothing in
      # either workflow shows why.
      #
      # `restore-keys` is additive: it changes neither what `key` hashes nor
      # what a new entry is saved under, it only lets a run that misses the
      # exact key fall back to the newest older entry with the same prefix.
      # Without it, editing a *comment* in embedding.py changes the hash and
      # makes the next run fully cold — which is what turns the step below from
      # a formality into the thing standing between CI and a 90 MB download.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-${{ hashFiles('backend/app/chat/embedding.py', 'backend/pyproject.toml') }}
          restore-keys: fastembed-${{ runner.os }}-
      - run: uv pip install --system -e "backend[dev]"
      # Fetch the weights HERE, in a step that names itself, rather than letting
      # the first test that needs them do it.
      #
      # Not an optimisation. tests/test_stream_cancellation.py starts a real
      # uvicorn and gives it 30 s to answer /health/live, and the lifespan in
      # app/main.py warms the embedder BEFORE the port opens. On a cold cache the
      # download eats that whole budget and the suite fails with "uvicorn never
      # became live" — a message pointing at the server, at asyncio, at anything
      # except a missing 90 MB file. Reproduced deterministically; with this step
      # the suite never races the download, and an unreachable network instead
      # produces a red step that says "could not fetch the embedding model".
      #
      # The lifespan warm-up stays unconditional and is not the thing to fix: a
      # deployed image whose Dockerfile download silently failed must fail loudly
      # at start-up rather than reach for HuggingFace on a visitor's first
      # question. This is the environment that has no image, so the fix lives
      # here.
      #
      # The step also refuses to leave a partial cache behind. An interrupted
      # download leaves a fraction of the weights (measured: 714 687 bytes of
      # 91 334 718), `actions/cache` would save that under this run's key, and
      # cache entries are immutable — so every later run would restore a broken
      # cache and re-download while the key looked like a hit. Wiping the
      # directory on failure is what stops that from ever being saved.
      - name: Fetch the embedding model
        run: |
          python - <<'PY'
          import shutil, sys

          from app.chat.embedding import cache_dir, get_embedder, model_is_cached

          target = cache_dir()
          try:
              get_embedder()._ensure()
          except BaseException as exc:
              shutil.rmtree(target, ignore_errors=True)
              sys.exit(f"could not fetch the embedding model: {exc!r}")
          if not model_is_cached():
              shutil.rmtree(target, ignore_errors=True)
              sys.exit(f"model cache in {target} is incomplete after a fetch that reported success")
          print(f"embedding model ready in {target}")
          PY
      - name: Create application roles
        # Must grant exactly what deploy/postgres/init/01-roles.sh grants for the
        # local Compose stack, or a permission drift here surfaces as a false RLS
        # failure that is expensive to tell apart from the real thing.
        run: |
          PGPASSWORD=migrator psql -h localhost -U lexloom_migrator -d lexloom -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE lexloom_app LOGIN PASSWORD 'app';
          CREATE ROLE lexloom_worker LOGIN PASSWORD 'worker';
          GRANT CONNECT ON DATABASE lexloom TO lexloom_app, lexloom_worker;
          GRANT USAGE ON SCHEMA public TO lexloom_app, lexloom_worker;
          SQL
      - run: ruff check backend/
      - name: Run migrations
        working-directory: backend
        env:
          # The migrator role, not the app role: migrations create tables and
          # the app role deliberately cannot (see the startup guard in
          # app/db/engine.py). alembic/env.py reads DATABASE_URL when no -x dsn
          # is given; alembic.ini only holds a placeholder DSN.
          DATABASE_URL: postgresql+asyncpg://lexloom_migrator:migrator@localhost:5432/lexloom
        # `python -m alembic`, not bare `alembic`: -m prepends the working
        # directory to sys.path. CI installs the project, so bare alembic would
        # work here too — but the deployed image installs dependencies only and
        # runs from the source tree, where it would not. Keeping -m means this
        # command is identical everywhere it runs.
        run: python -m alembic upgrade head
      - name: Tests
        working-directory: backend
        env:
          # The app role, not the migrator role: the startup guard in
          # app/db/engine.py refuses to run as a role that is a superuser, has
          # BYPASSRLS, or owns tables in schema public. The migrator role owns
          # every table it just created, so reusing its DSN here would trip the
          # guard on every DB-touching test.
          DATABASE_URL: postgresql+asyncpg://lexloom_app:app@localhost:5432/lexloom
          REDIS_URL: redis://localhost:6379/0
          ENV: ci
        run: pytest -v

  evals:
    runs-on: ubuntu-latest
    # No `needs: test`. The two jobs share no artefact, and gating this one
    # behind the suite would only delay the answer to "did this change retrieval
    # quality" by the length of the suite. They run side by side and fail
    # independently.
    #
    # Not a step inside `test` either: mixing them would mean every run of the
    # suite reseeds the corpus and embeds ~1008 chunks, and every eval run drags
    # the whole suite. Separate jobs give them separate wall time, separate
    # timeouts and separate reds.
    #
    # Ten minutes, not the fifteen the other jobs use and not the twenty the
    # plan guessed. Measured: a full reseed, re-embed and ninety searches takes
    # 69 s on a four-core development box, and the model download ahead of it is
    # cached. Ten is more than eight times the measured work, which is slack for
    # a slower runner without being a number that only ever fires on the wrong
    # thing.
    timeout-minutes: 10
    services:
      postgres:
        # The same image as the `test` job, and it has to be: pgvector is not in
        # stock postgres, and the vector and hybrid modes are two thirds of what
        # is measured here.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lexloom_migrator
          POSTGRES_PASSWORD: migrator
          POSTGRES_DB: lexloom
        options: >-
          --health-cmd "pg_isready -U lexloom_migrator" --health-interval 5s
          --health-timeout 3s --health-retries 10
        ports: ["5432:5432"]
      # No redis service, deliberately. See REDIS_URL below.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      # Byte-identical to the cache block in the `test` job above, which is
      # where the key is written and explained. Cache entries are
      # repository-scoped, so this shares that job's entry — but only while the
      # two spellings match exactly. Two spellings of one key are two keys: the
      # sharing this comment claims stops happening, each job downloads its own
      # 90 MB, and nothing in the workflow shows why.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ runner.os }}-${{ hashFiles('backend/app/chat/embedding.py', 'backend/pyproject.toml') }}
          restore-keys: fastembed-${{ runner.os }}-
      - run: uv pip install --system -e "backend[dev]"
      # Also copied verbatim from the `test` job, including the refusal to leave
      # a partial cache behind. Fetching here rather than letting the gate do it
      # is what keeps a slow huggingface.co reading as "the model did not
      # arrive" instead of "the eval gate is flaky" — and a gate people re-run
      # instead of read protects nothing.
      - name: Fetch the embedding model
        run: |
          python - <<'PY'
          import shutil, sys

          from app.chat.embedding import cache_dir, get_embedder, model_is_cached

          target = cache_dir()
          try:
              get_embedder()._ensure()
          except BaseException as exc:
              shutil.rmtree(target, ignore_errors=True)
              sys.exit(f"could not fetch the embedding model: {exc!r}")
          if not model_is_cached():
              shutil.rmtree(target, ignore_errors=True)
              sys.exit(f"model cache in {target} is incomplete after a fetch that reported success")
          print(f"embedding model ready in {target}")
          PY
      - name: Create application roles
        # Byte-identical to the same step in the `test` job, and it must stay
        # that way: a grant that drifts between the two surfaces here as an RLS
        # failure inside the eval seeder, which is the most expensive place in
        # this repository to discover a permissions difference.
        run: |
          PGPASSWORD=migrator psql -h localhost -U lexloom_migrator -d lexloom -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE lexloom_app LOGIN PASSWORD 'app';
          CREATE ROLE lexloom_worker LOGIN PASSWORD 'worker';
          GRANT CONNECT ON DATABASE lexloom TO lexloom_app, lexloom_worker;
          GRANT USAGE ON SCHEMA public TO lexloom_app, lexloom_worker;
          SQL
      - name: Run migrations
        working-directory: backend
        env:
          # The migrator role, for the same reason as the `test` job: the app
          # role deliberately cannot create tables.
          DATABASE_URL: postgresql+asyncpg://lexloom_migrator:migrator@localhost:5432/lexloom
        run: python -m alembic upgrade head
      - name: Retrieval quality must not regress
        working-directory: backend
        env:
          # The app role, not the migrator role. The startup guard in
          # app/db/engine.py refuses a role that owns tables in schema public —
          # and beyond the guard, measuring retrieval as a role RLS does not
          # constrain would measure a path no visitor ever takes.
          DATABASE_URL: postgresql+asyncpg://lexloom_app:app@localhost:5432/lexloom
          # A port nothing listens on, and no redis service above. Nothing on
          # the eval path may touch Redis: these numbers must come from Postgres
          # and the encoder alone. If this step ever fails with a connection
          # error, something on the path acquired a Redis dependency — the fix
          # is to remove it, not to add the service here.
          REDIS_URL: redis://127.0.0.1:1/0
          ENV: ci
        # --check, never --write: a job that can rewrite its own input cannot
        # fail on it. The recomputed numbers go to a file the next step uploads.
        #
        # OMP_NUM_THREADS is deliberately NOT set here, unlike in the Dockerfile
        # and in Task 19's measurement. The runner's cores are its own, retrieval
        # quality does not depend on how many it uses, and no duration from this
        # job reaches results.json — those are the local `--write` timings. A
        # number measured on a GitHub runner is comparable with nothing on the
        # deployment box, and publishing it in the panel would be signing
        # somebody else's measurement with our name.
        run: python -m app.evals.run --check --report evals-ci.json
      - name: Publish the recomputed numbers, pass or fail
        # `always()`, because the run that FAILED is the one whose numbers
        # somebody needs to look at, and without this they exist only in a log
        # line that scrolls.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-recomputed
          path: backend/evals-ci.json
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The exact version the deploy host runs, not "24" and not the floor
          # in `engines`. The frontend is built ON that host during a release,
          # so a build that passes here and fails there is a broken deploy that
          # CI called green.
          #
          # Exact, because the minor matters. "24" resolves to whatever the
          # runner's tool cache holds, which was behind the host — so CI ran
          # `npm ci` on npm 11.8 and passed, while the host's npm 11.9 rejected
          # the same lockfile as inconsistent and the deploy stopped dead. The
          # lockfile has to be generated by, and validated against, the npm that
          # actually builds the release.
          #
          # When the host's Node moves, move this with it.
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `next build` type-checks too, but only the files it reaches from a route.
      # Anything under lib/ that no page imports yet would go unchecked.
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: The export must actually contain the page
        # `next build` succeeds and emits nothing if `output: 'export'` is ever
        # dropped from next.config.mjs — the deploy would then copy an empty
        # directory into the web root and nginx would serve 404s for a site the
        # build called successful.
        run: test -f out/index.html

  compose-smoke:
    runs-on: ubuntu-latest
    # The polling loop below gives up after 60s, but `docker compose up --build`
    # ahead of it is unbounded.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Stack must come up on a clean machine
        # No .env is created here on purpose: a clean runner has none, and the
        # Compose file's ${VAR:-default} substitutions must be what makes the
        # stack usable without one. Targets /health/live, not /health/ready,
        # because liveness touches no dependencies — it only proves the process
        # started, which is what this smoke test exists to catch regressions in.
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8100/health/live && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8100/health/live || { docker compose logs; exit 1; }
      - name: ...and every service must still be running, not just the API
        # The API answering proves the API started. Each service constructs its
        # own settings, so one can exit at import while the other four stay up
        # and every HTTP check passes — which is exactly how a demo shipped with
        # no Celery worker. Compare the set, do not eyeball it.
        run: |
          docker compose ps
          running=$(docker compose ps --status running --format '{{.Service}}' | sort | tr '\n' ' ')
          expected='api beat postgres redis worker '
          test "$running" = "$expected" || {
            echo "running: [$running]"; echo "expected: [$expected]"
            docker compose logs
            exit 1
          }
