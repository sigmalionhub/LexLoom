# Response headers every LexLoom location must carry.
#
# Install as /etc/nginx/snippets/lexloom-headers.conf.
#
# THIS IS A FILE, AND IT IS INCLUDED IN EVERY LOCATION, BECAUSE OF ONE NGINX RULE:
# `add_header` directives are inherited from the enclosing block ONLY IF the inner
# block declares no `add_header` of its own. One `add_header Cache-Control` inside
# a location silently discards every header set on the server — no warning, no
# error, `nginx -t` passes.
#
# That is not hypothetical here. It was measured on the deployed site: the three
# security headers below reached /health/live and every proxied API path, and
# reached NEITHER the HTML page nor the static assets, because those two locations
# set their own Cache-Control. The headers were present in the config, absent from
# the page, and had been for the life of the vhost.
#
# So: any location that declares an `add_header` must also include this file.
# Including it where it would have been inherited anyway costs nothing and removes
# the need for the reader to work out which case they are in.

# Not indexed, deliberately. This is a portfolio demonstration whose link is sent
# to specific people; it is not a product seeking traffic, and a demo answering
# with a canned model has no business ranking for legal queries.
#
# `noindex` is the directive that actually removes a page from an index, and a
# crawler only sees it if it is allowed to FETCH the page — which is why
# robots.txt here permits crawling instead of forbidding it. `Disallow: /` would
# leave a URL discovered from a link indexable, listed without a snippet, and
# unremovable because the crawler is barred from reading the header that would
# have removed it.
#
# noarchive drops the cached copy, nosnippet the preview text. Open Graph tags are
# unaffected: Slack and LinkedIn fetch those directly and are not search indexers,
# so the link still unfurls properly when it is pasted to a client — which is the
# one thing this page is for.
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

# A Content-Security-Policy belongs here too, but Next injects inline hydration
# script and inline styles, so a policy written without testing it against the
# built export would silently blank the page. Add it deliberately, with the page
# open, rather than on faith.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
