[project]
name = "lexloom"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "structlog>=24.4",
    "sse-starlette>=2.1",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "pgvector>=0.3.6",
    # The ONNX embedding runtime. Upper-bounded, unlike everything above it,
    # and the bound is the point: this is the only dependency whose minor
    # version can change how much memory this process holds. The container
    # limits are sized against whole-process figures measured inside the image
    # under the real limits: 264 MiB for the API shape, 301 MiB for the worker
    # at a batch of 32 (fastembed 0.5.1, all-MiniLM-L6-v2), on a 2 GB box shared
    # with someone else's production. Those are not the model-only host figures
    # quoted in docker-compose.yml — the limits bound the whole process, not the
    # model. A floating minor that bumps ONNX Runtime would move these numbers
    # without moving any line in this repository, and the first symptom would be
    # an OOM kill of a neighbour.
    "fastembed>=0.5.1,<0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # The suite makes a database transaction block on purpose (the purge-race
    # test). Everything inside it is bounded, but a lock is exactly the failure
    # that outlives its own guards, and an unbounded pytest on GitHub Actions
    # runs to the six-hour job default before anyone learns anything.
    "pytest-timeout>=2.3",
    # docker-compose.yml is read by tests/test_compose_environment.py, which
    # checks that every containerised process can construct its settings on the
    # public box. Declared rather than leant on as a transitive dependency of
    # something else: the one thing that test must not do is fail to import and
    # be counted as absent.
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Declare the package explicitly. Once `alembic/` exists next to `app/`,
# setuptools' flat-layout auto-discovery sees two candidate top-level packages
# and refuses to build — so `pip install -e .` fails on a clean clone while
# continuing to work in any venv created before the migrations existed. That is
# the worst shape of bug for a portfolio repository: it breaks for every reader
# and for nobody who built it.
#
# find/include (not a literal `packages = ["app"]` list): a literal list is
# not recursive, so it would ship only app/__init__.py and silently drop every
# subpackage (app.api, app.api.v1, app.db, app.worker) from a non-editable
# build. Nothing exercises that path today (CI and local dev both install
# editable), which is exactly why it would have broken confusingly later.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Per test, not per run. The slowest test here waits for a Postgres backend to
# reach a row lock and gives that 30s of its own; 120 leaves room for a loaded
# CI runner while still turning a genuine hang into a reported failure with a
# traceback pointing at the line that hung.
timeout = 120
# Registered rather than left implicit, so `--strict-markers` stays available
# and a typo in the decorator is an error instead of a test that never runs.
# conftest.py skips these when the weights are absent; see the hook there for
# why an absent model is a skip and not a failure.
markers = [
    "model: needs the real ONNX embedding weights on disk (~90 MB)",
]
