  <rect x="6" y="9" width="20" height="1.5" rx="0.75" fill="#DBE2EA" opacity="0.55" />
  <rect x="9" y="14.5" width="3" height="3" rx="1.5" fill="#D59C3C" />
  <rect x="15" y="15.25" width="11" height="1.5" rx="0.75" fill="#8A6A2C" />
  <rect x="6" y="21" width="14" height="1.5" rx="0.75" fill="#DBE2EA" opacity="0.55" />
</svg>
